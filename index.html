<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚 Library Management System</h1>
        <p>Manage your books easily</p>
    </header>

    <main class="container">

        <!-- Dashboard -->
        <section class="dashboard">
            <div class="card">
                <h3>Total Books</h3>
                <p id="totalBooks">0</p>
            </div>

            <div class="card">
                <h3>Available</h3>
                <p id="availableBooks">0</p>
            </div>

            <div class="card">
                <h3>Issued</h3>
                <p id="issuedBooks">0</p>
            </div>
        </section>

        <!-- Add Book -->
        <section class="form-section">
            <h2>Add New Book</h2>

            <form id="bookForm">
                <input
                    type="text"
                    id="bookTitle"
                    placeholder="Book Title"
                    required
                >

                <input
                    type="text"
                    id="author"
                    placeholder="Author Name"
                    required
                >

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    required
                >

                <button type="submit">➕ Add Book</button>
            </form>
        </section>

        <!-- Search -->
        <section class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search by title, author or category..."
            >
        </section>

        <!-- Books -->
        <section>
            <h2>Book List</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Book Title</th>
                            <th>Author</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="bookList">
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 Library Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
